<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English AR Lesson - What's wrong?</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.6/aframe/build/aframe-ar.js"></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: Arial, sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; }
        #ui-container {
            position: fixed; bottom: 20px; left: 0; width: 100%;
            text-align: center; z-index: 99999; box-sizing: border-box;
            padding: 0 15px; pointer-events: none;
        }
        .question-box {
            background: rgba(0,0,0,0.9); color: white; padding: 15px 20px;
            border-radius: 15px; display: inline-block; font-size: 16px;
            max-width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.2); pointer-events: auto;
        }
        .buttons-group { margin-top: 10px; display: flex; justify-content: center; gap: 10px; }
        .btn {
            background-color: #4CAF50; color: white; border: none;
            padding: 10px 18px; font-size: 15px; border-radius: 8px;
            cursor: pointer; font-weight: bold;
        }
        .btn:active { background-color: #388E3C; }
        #feedback { font-size: 16px; font-weight: bold; margin-top: 8px; }
        .creators-credit { margin-top: 8px; font-size: 12px; color: #aaa; letter-spacing: 0.5px; }
        #status {
            position: fixed; top: 20px; left: 0; width: 100%; text-align: center;
            z-index: 99999; color: #fff; font-size: 14px; font-weight: bold;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8); pointer-events: none;
        }
        /* The character photo is a normal <img> placed over the camera video.
           A plain image is always full color on every phone (no WebGL involved). */
        #ar-photo {
            position: fixed; left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            z-index: 100; pointer-events: none; display: none;
            will-change: transform, height;
        }
        #ar-photo img {
            display: block; width: auto;
            filter: drop-shadow(0 8px 22px rgba(0,0,0,0.4));
        }
    </style>
</head>
<body>
    <div id="status">Camera is starting... please allow camera access</div>

    <div id="ar-photo"><img id="ar-photo-img" src="case1.png" alt=""></div>

    <div id="ui-container">
        <div class="question-box">
            <div id="question-text">What's wrong?</div>
            <div class="buttons-group" id="options">
                <button id="btn-a" class="btn" onclick="checkAnswer(0)">a) He has a cold</button>
                <button id="btn-b" class="btn" onclick="checkAnswer(1)">b) He has a headache</button>
            </div>
            <div id="feedback"></div>
            <div class="creators-credit">Created by Noha Fayed</div>
        </div>
    </div>

    <!-- A-Frame + AR.js only provides the camera video background (it renders in color). -->
    <a-scene id="scene" embedded arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
             renderer="colorManagement: false" vr-mode-ui="enabled: false"></a-scene>

    <script>
        const statusEl = document.getElementById("status");
        const photoEl = document.getElementById("ar-photo");
        const photoImg = document.getElementById("ar-photo-img");

        // ---------------- photo size & gestures (pinch = resize, drag = rotate) ----------------
        let scale = 1.85;          // default photo size (matches the liked size)
        let rotationYDeg = 0;      // degrees, rotates the photo like before
        let lastPinchDist = 0;
        let lastTouchX = 0;

        // scale 1.85 -> about 63% of the screen height (same as the liked size)
        const baseHeight = function () { return window.innerHeight * 0.34; };

        function drawPhoto() {
            const h = Math.round(scale * baseHeight());
            photoImg.style.height = h + 'px';
            photoEl.style.transform =
                'translate(-50%, -50%) rotateY(' + (rotationYDeg * Math.PI / 180) + 'rad)';
        }

        function pinchDist(e) {
            const t = e.touches;
            const dx = t[1].clientX - t[0].clientX;
            const dy = t[1].clientY - t[0].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        window.addEventListener('touchstart', function (e) {
            if (e.touches.length === 2) { lastPinchDist = pinchDist(e); lastTouchX = 0; }
            else if (e.touches.length === 1) { lastTouchX = e.touches[0].clientX; }
        }, { passive: true });

        window.addEventListener('touchmove', function (e) {
            if (e.touches.length === 2) {
                e.preventDefault();
                const d = pinchDist(e);
                if (lastPinchDist > 0) {
                    scale = Math.min(4.5, Math.max(0.4, scale * (d / lastPinchDist)));
                    drawPhoto();
                }
                lastPinchDist = d;
            } else if (e.touches.length === 1) {
                if (lastTouchX === 0) { lastTouchX = e.touches[0].clientX; }
                const dx = e.touches[0].clientX - lastTouchX;
                rotationYDeg += dx * 0.5;
                lastTouchX = e.touches[0].clientX;
                drawPhoto();
            }
        }, { passive: false });

        window.addEventListener('touchend', function (e) {
            if (e.touches.length < 2) lastPinchDist = 0;
            if (e.touches.length === 0) lastTouchX = 0;
        });

        // ---------------- show the photo ----------------
        let photoShown = false;

        function showPhoto(message) {
            if (!photoShown) {
                photoShown = true;
                drawPhoto();
                photoEl.style.display = 'block';
            }
            if (message) statusEl.innerText = message;
        }

        // 1) Show the photo the moment the camera video is really playing.
        const videoTimer = setInterval(function () {
            const vids = document.querySelectorAll('video');
            for (let i = 0; i < vids.length; i++) {
                const v = vids[i];
                if (v.srcObject && v.readyState >= 2 && !v.paused) {
                    clearInterval(videoTimer);
                    showPhoto('Camera ready - photo in front of you');
                    return;
                }
            }
        }, 250);

        // 2) Fallback: always show the photo, even if the camera is slow.
        setTimeout(function () { showPhoto(); }, 4000);

        // 3) If the camera never starts, tell the user what to do.
        setTimeout(function () {
            if (statusEl.innerText === "Camera is starting... please allow camera access") {
                statusEl.innerText = "Camera is starting... if the screen is dark, allow camera access in Safari settings";
            }
        }, 10000);

        window.addEventListener('resize', drawPhoto);

        // ---------------- questions ----------------
        const casesData = [
            { optA: "a) He has a cold", optB: "b) He has a headache", correct: 0 },
            { optA: "a) She has a fever", optB: "b) She has a headache", correct: 1 },
            { optA: "a) He has a stomachache", optB: "b) He has a toothache", correct: 0 },
            { optA: "a) She has an earache", optB: "b) She has a sore throat", correct: 1 },
            { optA: "a) He has a backache", optB: "b) He has a fever", correct: 1 }
        ];

        let currentCaseIndex = 0;

        function updateCase() {
            if (currentCaseIndex < casesData.length) {
                photoImg.src = 'case' + (currentCaseIndex + 1) + '.png';
                document.getElementById("btn-a").innerText = casesData[currentCaseIndex].optA;
                document.getElementById("btn-b").innerText = casesData[currentCaseIndex].optB;
                document.getElementById("feedback").innerText = "";
                statusEl.innerText = "Case " + (currentCaseIndex + 1) + " of 5";
            } else {
                document.getElementById("question-text").innerText = "Lesson Completed!";
                document.getElementById("options").style.display = "none";
                document.getElementById("feedback").style.color = "#4CD964";
                document.getElementById("feedback").innerText = "Amazing Job!";
                statusEl.innerText = "";
            }
        }

        function checkAnswer(selectedIndex) {
            const feedbackEl = document.getElementById("feedback");
            const correctIndex = casesData[currentCaseIndex].correct;

            if (selectedIndex === correctIndex) {
                feedbackEl.style.color = "#4CD964";
                feedbackEl.innerText = "Great Job! Correct!";

                setTimeout(function () {
                    currentCaseIndex++;
                    updateCase();
                }, 1500);
            } else {
                feedbackEl.style.color = "#FF3B30";
                feedbackEl.innerText = "Try Again!";
            }
        }
    </script>
</body>
</html>
